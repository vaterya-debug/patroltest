<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海巡署東部分署115年巡防情報業務輔訪線上測驗系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js CDN (用於匯出 PDF 與截圖) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6">

    <!-- 主容器 -->
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 sm:p-10 my-auto">

        <!-- 第一部分：基本資料填寫頁 -->
        <div id="login-section">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-2 text-center leading-relaxed">海巡署東部分署115年巡防情報業務輔訪線上測驗系統</h1>
            <p class="text-slate-500 text-center mb-8 text-sm sm:text-base">請先填寫基本資料，點擊開始測驗後即開始計時（10分鐘）</p>
            
            <form id="user-form" class="space-y-5 max-w-xl mx-auto">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">單位</label>
                    <input type="text" id="unit" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：第一二岸巡隊">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">職稱</label>
                    <input type="text" id="title" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：小隊長">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">姓名</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 text-base border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="例如：葉小P">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3.5 rounded-xl transition duration-200 mt-6 text-lg shadow-md">
                    進入測驗
                </button>
            </form>
        </div>

        <!-- 載入中狀態 -->
        <div id="loading-section" class="hidden text-center py-16">
            <div class="inline-block animate-spin rounded-full h-14 w-14 border-4 border-blue-600 border-t-transparent"></div>
            <p class="text-slate-600 mt-4 font-medium text-base sm:text-lg">正在透過雲端安全通道載入題庫，請稍候...</p>
        </div>

        <!-- 第二部分：測驗作答頁 -->
        <div id="quiz-section" class="hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 mb-6 gap-3">
                <div>
                    <span id="display-user-info" class="text-sm sm:text-base font-semibold text-slate-700"></span>
                </div>
                <div class="bg-red-50 text-red-600 px-4 py-2 rounded-full font-bold text-sm sm:text-base border border-red-200 flex items-center gap-1.5 shadow-sm">
                    <span>剩餘時間：</span>
                    <span id="timer">10:00</span>
                </div>
            </div>

            <div id="questions-container" class="space-y-6">
                <!-- 動態載入題目 -->
            </div>

            <div class="mt-10 text-center">
                <button id="submit-btn" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-10 py-4 rounded-xl shadow-lg transition duration-200 text-lg">
                    交卷並送出成績
                </button>
            </div>
        </div>

        <!-- 第三部分：成績與詳細成果頁 -->
        <div id="result-section" class="hidden">
            <!-- 匯出範圍容器 (PDF 與截圖會抓取此區塊) -->
            <div id="printable-area" class="bg-white p-2 sm:p-4">
                <div class="text-center pb-6 border-b">
                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-800 mb-2">測驗成果報告</h2>
                    <p class="text-slate-500 text-sm">海巡署東部分署115年巡防情報業務輔訪線上測驗</p>
                </div>

                <!-- 成績總覽卡片 -->
                <div class="my-6 bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center shadow-inner">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 text-sm sm:text-base text-slate-600 mb-4">
                        <div>單位：<span id="res-unit" class="font-bold text-slate-800"></span></div>
                        <div>職稱：<span id="res-title" class="font-bold text-slate-800"></span></div>
                        <div>姓名：<span id="res-name" class="font-bold text-slate-800"></span></div>
                    </div>
                    <div class="text-5xl sm:text-6xl font-extrabold text-blue-600 mb-2"><span id="res-score">0</span> <span class="text-2xl font-bold">分</span></div>
                    <p class="text-sm sm:text-base text-slate-600 font-medium" id="res-detail"></p>
                </div>

                <!-- 各題詳細作答檢視清單 -->
                <div class="mt-8">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-l-4 border-blue-600 pl-3">各題作答詳細檢視</h3>
                    <div id="review-container" class="space-y-4">
                        <!-- 動態插入答題檢視 -->
                    </div>
                </div>
            </div>

            <!-- 操作按鈕區 -->
            <div class="mt-8 pt-6 border-t flex flex-wrap justify-center gap-3">
                <button onclick="exportPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 text-sm sm:text-base shadow flex items-center gap-2">
                    📥 下載成績單 PDF
                </button>
                <button onclick="exportScreenshot()" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 text-sm sm:text-base shadow flex items-center gap-2">
                    📸 下載成果截圖
                </button>
                <button onclick="location.reload()" class="bg-slate-600 hover:bg-slate-700 text-white font-semibold px-6 py-3 rounded-xl transition duration-200 text-sm sm:text-base shadow">
                    🔄 重新測驗
                </button>
            </div>
        </div>

    </div>

    <script>
        // 題庫讀取專用 GAS 網址
        const QUIZ_GAS_URL = "https://script.google.com/macros/s/AKfycbwMMIEtRg6j7xZleKDyxmHHpvflsIYpLXqnI954Yl9COm5RcECUY8uaw_FZoMXqS46NIA/exec";
        
        // 成績寫入專用 GAS 網址
        const SCORE_GAS_URL = "https://script.google.com/macros/s/AKfycbxuJDj72g_CVQ4am3PVr2wVdA4ZJQZOBbjMf1Mw9avp4VlduNXSKvTzZ1XVzZO7WvlwiA/exec";

        let userInfo = {};
        let quizData = [];
        let userAnswers = {}; 
        let detailedResults = []; 
        let timerInterval;
        let timeLeft = 600; // 10 分鐘 (600秒)
        let quizStarted = false;
        let quizSubmitted = false;

        const loginSection = document.getElementById('login-section');
        const loadingSection = document.getElementById('loading-section');
        const quizSection = document.getElementById('quiz-section');
        const resultSection = document.getElementById('result-section');
        const userForm = document.getElementById('user-form');
        const questionsContainer = document.getElementById('questions-container');
        const timerDisplay = document.getElementById('timer');
        const submitBtn = document.getElementById('submit-btn');

        userForm.addEventListener('submit', function(e) {
            e.preventDefault();
            userInfo = {
                unit: document.getElementById('unit').value.trim(),
                title: document.getElementById('title').value.trim(),
                name: document.getElementById('name').value.trim()
            };

            loginSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');

            loadQuestionsFromGAS();
        });

        function loadQuestionsFromGAS() {
            fetch(QUIZ_GAS_URL)
                .then(response => response.json())
                .then(rawData => {
                    let validQuestions = rawData.filter(row => row['題目'] && row['選項A'] && row['正確答案']);

                    if (validQuestions.length === 0) {
                        alert("題庫載入失敗或無有效題目，請檢查 Google 試算表格式！");
                        location.reload();
                        return;
                    }

                    validQuestions.sort(() => Math.random() - 0.5);
                    quizData = validQuestions.slice(0, 20);

                    loadingSection.classList.add('hidden');
                    startQuiz();
                })
                .catch(err => {
                    alert("無法讀取題庫，請確認 Apps Script 部署權限或網路連線！");
                    location.reload();
                });
        }

        function startQuiz() {
            quizSection.classList.remove('hidden');
            document.getElementById('display-user-info').innerText = `單位：${userInfo.unit} | 職稱：${userInfo.title} | 姓名：${userInfo.name}`;
            
            quizStarted = true;
            renderQuestions();
            startTimer();

            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('beforeunload', handleBeforeUnload);
        }

        function renderQuestions() {
            let html = '';
            quizData.forEach((q, index) => {
                html += `
                    <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="font-bold text-slate-800 mb-4 text-base sm:text-lg leading-relaxed">${index + 1}. ${q['題目']}</p>
                        <div class="space-y-3">
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="A" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">A. ${q['選項A'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="B" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">B. ${q['選項B'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="C" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">C. ${q['選項C'] || ''}</span>
                            </label>
                            <label class="flex items-center space-x-3 p-3 rounded-lg hover:bg-white active:bg-blue-50 cursor-pointer transition border border-transparent hover:border-slate-200">
                                <input type="radio" name="q_${index}" value="D" class="text-blue-600 focus:ring-blue-500 h-5 w-5">
                                <span class="text-slate-700 text-base">D. ${q['選項D'] || ''}</span>
                            </label>
                        </div>
                    </div>
                `;
            });
            questionsContainer.innerHTML = html;
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                timerDisplay.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert("測驗時間已到，系統將自動交卷！");
                    submitQuiz();
                }
            }, 1000);
        }

        function handleVisibilityChange() {
            if (document.hidden && quizStarted && !quizSubmitted) {
                alert("警告：偵測到您離開測驗頁面或切換分頁，測驗將強制結束！");
                submitQuiz();
            }
        }

        function handleBeforeUnload(e) {
            if (quizStarted && !quizSubmitted) {
                e.preventDefault();
                e.returnValue = '';
            }
        }

        submitBtn.addEventListener('click', function() {
            if (confirm("確定要交卷嗎？")) {
                submitQuiz();
            }
        });

        function submitQuiz() {
            if (quizSubmitted) return;
            quizSubmitted = true;
            clearInterval(timerInterval);

            document.removeEventListener('visibilitychange', handleVisibilityChange);
            window.removeEventListener('beforeunload', handleBeforeUnload);

            let correctCount = 0;
            let totalQ = quizData.length;
            detailedResults = [];

            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                let userAns = selected ? selected.value.trim().toUpperCase() : "未作答";
                let correctAns = q['正確答案'].trim().toUpperCase();
                let isCorrect = false;

                if (userAns !== "未作答") {
                    if (correctAns.includes(userAns) || userAns === correctAns.charAt(0)) {
                        correctCount++;
                        isCorrect = true;
                    }
                }

                detailedResults.push({
                    qIndex: index + 1,
                    question: q['題目'],
                    userAnswer: userAns,
                    correctAnswer: q['正確答案'],
                    isCorrect: isCorrect
                });
            });

            let score = correctCount * 5; // 每題 5 分，總分 100 分

            quizSection.classList.add('hidden');
            resultSection.classList.remove('hidden');
            document.getElementById('res-unit').innerText = userInfo.unit;
            document.getElementById('res-title').innerText = userInfo.title;
            document.getElementById('res-name').innerText = userInfo.name;
            document.getElementById('res-score').innerText = score;
            document.getElementById('res-detail').innerText = `共作答 ${totalQ} 題，答對 ${correctCount} 題（每題 5 分）`;

            renderReviewList();
            sendScoreToSheet(score, detailedResults);
        }

        function renderReviewList() {
            let reviewHtml = '';
            detailedResults.forEach((item) => {
                let statusBadge = item.isCorrect 
                    ? `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">正確 (+5分)</span>`
                    : `<span class="bg-red-100 text-red-800 text-xs font-bold px-2.5 py-1 rounded-full">錯誤 (0分)</span>`;

                let qData = quizData[item.qIndex - 1];

                reviewHtml += `
                    <div class="bg-slate-50 p-4 sm:p-5 rounded-xl border ${item.isCorrect ? 'border-emerald-200' : 'border-red-200'}">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <p class="font-bold text-slate-800 text-sm sm:text-base">${item.qIndex}. ${item.question}</p>
                            <div>${statusBadge}</div>
                        </div>
                        <div class="text-xs sm:text-sm space-y-1 mt-2">
                            <p class="text-slate-600">A. ${qData['選項A'] || ''}</p>
                            <p class="text-slate-600">B. ${qData['選項B'] || ''}</p>
                            <p class="text-slate-600">C. ${qData['選項C'] || ''}</p>
                            <p class="text-slate-600">D. ${qData['選項D'] || ''}</p>
                        </div>
                        <div class="mt-3 pt-2 border-t border-slate-200 flex flex-wrap gap-4 text-xs sm:text-sm font-semibold">
                            <span class="${item.isCorrect ? 'text-emerald-600' : 'text-red-600'}">您的選擇：${item.userAnswer}</span>
                            <span class="text-blue-600">正確答案：${item.correctAnswer}</span>
                        </div>
                    </div>
                `;
            });
            document.getElementById('review-container').innerHTML = reviewHtml;
        }

        function exportPDF() {
            const element = document.getElementById('printable-area');
            const opt = {
                margin:       10,
                filename:     `測驗成績單_${userInfo.unit}_${userInfo.name}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        function exportScreenshot() {
            const element = document.getElementById('printable-area');
            element.style.background = "#ffffff";
            
            html2pdf().from(element).outputPdf('canvas').then(canvas => {
                let imageURL = canvas.toDataURL('image/png');
                let link = document.createElement('a');
                link.href = imageURL;
                link.download = `測驗成果截圖_${userInfo.unit}_${userInfo.name}.png`;
                link.click();
            });
        }

        function sendScoreToSheet(score, details) {
            const payload = {
                unit: userInfo.unit,
                title: userInfo.title,
                name: userInfo.name,
                score: score,
                timeStr: new Date().toLocaleString(),
                details: details
            };

            fetch(SCORE_GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                console.log("成績與詳細作答紀錄已成功送出至雲端試算表");
            }).catch(err => {
                console.error("成績送出失敗", err);
            });
        }
    </script>
</body>
</html>
